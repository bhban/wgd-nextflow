  iqtree: "/exports/cmvm/eddie/eb/groups/macqueen_lab/brianna/containers/iqtree_1.0.sif"
  alerax: "/exports/cmvm/eddie/eb/groups/macqueen_lab/brianna/containers/alerax_1.0.sif"
  annevo: "/exports/cmvm/eddie/eb/groups/macqueen_lab/brianna/containers/annevo_1.0.sif"
  gffutils: "/exports/cmvm/eddie/eb/groups/macqueen_lab/brianna/containers/gffutils_1.0.sif"
  redip: "/exports/cmvm/eddie/eb/groups/macqueen_lab/brianna/containers/redip_1.0.sif"
  redip_ggtree: "/exports/cmvm/eddie/eb/groups/macqueen_lab/brianna/containers/redip-ggtree_1.0.sif"

genomes_tsv: "/exports/cmvm/eddie/eb/groups/macqueen_lab/brianna/data/ericales/genomes_ebenaceae.tsv"
species_tree: "/exports/cmvm/eddie/eb/groups/macqueen_lab/brianna/data/ericales/species_tree_ebenaceae.nwk"

gff_dir: "/exports/cmvm/eddie/eb/groups/macqueen_lab/brianna/data/ericales/gff_chromosome"
protein_dir: "/exports/cmvm/eddie/eb/groups/macqueen_lab/brianna/data/ericales/proteins_chromosome"
cds_dir: "/exports/cmvm/eddie/eb/groups/macqueen_lab/brianna/data/ericales/cds_chromosome"
