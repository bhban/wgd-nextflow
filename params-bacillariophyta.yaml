# params-bacillariophyta.yaml

sif_paths:
  genespace: "/exports/cmvm/eddie/eb/groups/macqueen_lab/brianna/containers/genespace_1.1.sif"
  macse: "/exports/cmvm/eddie/eb/groups/macqueen_lab/brianna/containers/macse_1.0.sif"
  mafft: "/exports/cmvm/eddie/eb/groups/macqueen_lab/brianna/containers/mafft_1.0.sif"
  iqtree: "/exports/cmvm/eddie/eb/groups/macqueen_lab/brianna/containers/iqtree_1.0.sif"
  alerax: "/exports/cmvm/eddie/eb/groups/macqueen_lab/brianna/containers/alerax_1.0.sif"
  annevo: "/exports/cmvm/eddie/eb/groups/macqueen_lab/brianna/containers/annevo_1.0.sif"
  gffutils: "/exports/cmvm/eddie/eb/groups/macqueen_lab/brianna/containers/gffutils_1.0.sif"
  redip: "/exports/cmvm/eddie/eb/groups/macqueen_lab/brianna/containers/redip_1.0.sif"
  redip_ggtree: "/exports/cmvm/eddie/eb/groups/macqueen_lab/brianna/containers/redip-ggtree_1.0.sif"
  treeclean: "/exports/cmvm/eddie/eb/groups/macqueen_lab/brianna/containers/treeclean_1.0.sif"
  
# Run mode
start_mode: full

# Input metadata
genomes_tsv: /exports/eddie/scratch/s2428892/nf-centrics/input/genomes.tsv

# Input directories
gff_dir: /exports/eddie/scratch/s2428892/nf-centrics/input/gff
protein_dir: /exports/eddie/scratch/s2428892/nf-centrics/input/protein
cds_dir: /exports/eddie/scratch/s2428892/nf-centrics/input/cds
chr_dict_dir: /exports/eddie/scratch/s2428892/nf-centrics/input/chr_dict

# File extensions
ext:
  gff: gff3
  pep: pep.fa
  cds: cds.fa

# GENESPACE / OrthoFinder options
run_external_orthofinder: false
orthofinder_in_blk: true
force_orthofinder: false
rawOrthofinderDir: null
blkSize: 5

# No species tree for this run
species_tree: null
use_species_tree_for_orthofinder: false
use_species_tree_for_alerax: false

# Triparma as outgroup
require_outgroup_og: true

# Optional post-processing
collapse_tandems: false
tandem_max_ord_gap: 2

# AleRax disabled
run_alerax: false

# Rediploidisation disabled
run_rediploidisation: false

# rediploidisation settings
#rediploidisation:
#  classify_mode: 'recurrent_lossy'
